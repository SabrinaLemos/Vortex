spring.application.name=vortex
server.port=8080

# Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vortex}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Upload de Arquivos CAD 3D (STL, STEP, OBJ até 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Configurações do Ecossistema Vórtex
vortex.storage.local-dir=./uploads/cad
vortex.jwt.secret=${JWT_SECRET:9a4f2c8d1e3b5a709a4f2c8d1e3b5a709a4f2c8d1e3b5a709a4f2c8d1e3b5a70}
vortex.jwt.expiration-ms=86400000
vortex.jwt.refresh-expiration-ms=2592000000

# Logging
logging.level.com.vortex.vortex=INFO
logging.level.org.springframework.security=WARN
